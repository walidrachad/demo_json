name: Publish Voice Party Audio

on:
  push:
    paths:
      - '.github/workflows/publish-voice-party-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download staged audio archive
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://filebin.net/voice-party-20261014-7f3a2c9d/audio.zip' \
            -o /tmp/voice_party_audio.zip
          unzip -t /tmp/voice_party_audio.zip

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip

      - name: Build production WAV files
        run: |
          set -euo pipefail
          rm -rf /tmp/voice_party_opus voice_party/audio
          mkdir -p /tmp/voice_party_opus voice_party/audio
          unzip -q /tmp/voice_party_audio.zip -d /tmp/voice_party_opus
          for i in $(seq 1 22); do
            test -s "/tmp/voice_party_opus/${i}.opus"
            ffmpeg -hide_banner -loglevel error -y \
              -i "/tmp/voice_party_opus/${i}.opus" \
              -ac 1 -ar 16000 -c:a pcm_s16le \
              "voice_party/audio/${i}.wav"
            test -s "voice_party/audio/${i}.wav"
          done
          test "$(find voice_party/audio -maxdepth 1 -name '*.wav' | wc -l)" -eq 22

      - name: Generate levels JSON
        run: |
          python3 - <<'PY'
          import json
          base = 'https://raw.githubusercontent.com/walidrachad/demo_json/main/voice_party/audio'
          rounds = [f'{base}/{(i % 22) + 1}.wav' for i in range(90)]
          data = {
              'schemaVersion': 2,
              'levels': [
                  {'rounds': [{'audioUrl': rounds[level * 3 + r]} for r in range(3)]}
                  for level in range(30)
              ],
          }
          with open('voice_party/levels.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, separators=(',', ':'))
              f.write('\n')
          PY

      - name: Verify output
        run: |
          python3 - <<'PY'
          import json, pathlib, wave
          data = json.load(open('voice_party/levels.json', encoding='utf-8'))
          assert data['schemaVersion'] == 2
          assert len(data['levels']) == 30
          urls = []
          for level in data['levels']:
              assert len(level['rounds']) == 3
              urls += [r['audioUrl'] for r in level['rounds']]
          assert len(urls) == 90
          assert len(set(urls)) == 22
          for i in range(1, 23):
              p = pathlib.Path(f'voice_party/audio/{i}.wav')
              with wave.open(str(p), 'rb') as w:
                  assert w.getnchannels() == 1
                  assert w.getsampwidth() == 2
                  assert w.getframerate() == 16000
                  assert w.getnframes() > 0
          print('Verified 22 PCM WAV files and 30 x 3 rounds')
          PY

      - name: Commit generated audio and levels
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add voice_party/audio voice_party/levels.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Replace Voice Party audio with new 22-clip set'
          git push
