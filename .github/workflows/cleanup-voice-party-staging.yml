name: Cleanup Voice Party Audio Staging

on:
  push:
    paths:
      - '.github/workflows/cleanup-voice-party-staging.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary staging files
        run: |
          set -euo pipefail
          rm -rf voice_party/payload voice_party/payload_v2
          rm -f .github/workflows/publish-voice-party-audio.yml
          rm -f .github/workflows/cleanup-voice-party-staging.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove temporary Voice Party audio staging files'
          git push
